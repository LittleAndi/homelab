# MicroK8s cluster nodes (ADR-0008). IPs .20-.24; Proxmox host is .10.
# cp1 bootstraps the cluster; cp2/cp3 join as control plane (dqlite voters),
# wk1/wk2 join with --worker.
[control_plane]
cp1 ansible_host=192.168.1.20
cp2 ansible_host=192.168.1.21
cp3 ansible_host=192.168.1.22

[workers]
wk1 ansible_host=192.168.1.23
wk2 ansible_host=192.168.1.24

[k8s:children]
control_plane
workers

[k8s:vars]
ansible_user=ubuntu
