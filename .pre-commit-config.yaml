# Install once per clone:  pipx install pre-commit && pre-commit install
# Update hook versions:    pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
      # Reviewing a branch (e.g. pushed by the sbx agent): the hook above
      # only scans staged changes, so scan the branch's commits instead.
      #   pre-commit run --hook-stage manual gitleaks-range
      - id: gitleaks
        alias: gitleaks-range
        name: Detect hardcoded secrets (origin/main..HEAD)
        entry: gitleaks git --redact --verbose --log-opts=origin/main..HEAD
        stages: [manual]
        always_run: true   # no staged files when reviewing a branch
  - repo: local
    hooks:
      - id: site-values
        name: block real site values (site.env)
        entry: scripts/check-site-values.sh
        language: script
