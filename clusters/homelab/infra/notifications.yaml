# Failed reconciliations to Discord (ADR-0018 §5), same channel as ADR-0015.
# Secret created by hand, key `address` = webhook URL:
#   read -rs URL; kubectl -n flux-system create secret generic discord-webhook \
#     --from-file=address=<(printf %s "$URL"); unset URL
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  username: flux
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-errors
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
    - kind: OCIRepository
      name: "*"
    - kind: Kustomization
      name: "*"
